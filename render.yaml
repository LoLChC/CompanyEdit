services:
  - type: web
    name: sirket-yonetim-paneli
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn sirket_panel.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"