{% extends 'yonetim/base.html' %}

{% block title %}Yeni Fiş | EfeZade Group - Şirket Yönetimi{% endblock %}
{% block page_title %}Yeni Fiş Ekle{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2>Fiş Bilgileri</h2>
    </div>
    <form method="post" action="{% url 'yonetim:fis_ekle' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label for="fis_turu">Fiş Türü</label>
                <select id="fis_turu" name="fis_turu" required>
                    {% for key, val in fis_turu_secenekleri %}
                    <option value="{{ key }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="fis_no">Fiş Numarası</label>
                <input type="text" id="fis_no" name="fis_no" maxlength="60" placeholder="Opsiyonel">
            </div>
            <div class="form-group">
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih" value="{{ bugun|date:'Y-m-d' }}" required>
            </div>
            <div class="form-group">
                <label for="cari_hesap">Kurum Cari Hesabı (Opsiyonel)</label>
                <select id="cari_hesap" name="cari_hesap">
                    <option value="">— Cari Seçiniz —</option>
                    {% for cari in cariler %}
                    <option value="{{ cari.id }}">{{ cari.unvan }}</option>
                    {% endfor %}
                </select>
                <span class="field-hint">Sadece kurum ise seçiniz</span>
            </div>
            <div class="form-group">
                <label for="aciklama">Alınan Mal/Hizmet Açıklaması</label>
                <textarea id="aciklama" name="aciklama" required placeholder="Neler alındı?"></textarea>
            </div>
            <div class="form-group">
                <label for="tutar">Tutar (KDV Dahil Toplam TL)</label>
                <input type="number" id="tutar" name="tutar" step="0.01" min="0" required placeholder="0.00" inputmode="decimal">
            </div>
            <div class="form-group">
                <label for="kdv_orani">KDV Oranı (%)</label>
                <select id="kdv_orani" name="kdv_orani" required>
                    <option value="20">20%</option>
                    <option value="10">10%</option>
                    <option value="1">1%</option>
                    <option value="0">0%</option>
                </select>
            </div>
            <div class="form-group">
                <label for="odeme_durumu">Ödeme Durumu</label>
                <select id="odeme_durumu" name="odeme_durumu" required>
                    {% for key, val in durum_secenekleri %}
                    <option value="{{ key }}">{{ val }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="fis_gorseli">Fiş Görseli (Opsiyonel)</label>
                <input type="file" id="fis_gorseli" name="fis_gorseli" accept="image/*,application/pdf">
            </div>
            <div class="form-group" style="display:none;">
                <label for="butce">İlgili Bütçe</label>
                <select id="butce" name="butce">
                    <option value="">— Seçilmedi —</option>
                    {% for butce in butceler %}
                    <option value="{{ butce.id }}">#{{ butce.id }} — Güncel: {{ butce.guncel_butce }} TL</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Kaydet</button>
            <a href="{% url 'yonetim:fis_liste' %}" class="btn btn-secondary">İptal</a>
        </div>
    </form>
</div>
{% endblock %}
