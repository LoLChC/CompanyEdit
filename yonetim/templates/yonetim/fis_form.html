{% extends 'yonetim/base.html' %}

{% block title %}Yeni Fiş | Şirket Yönetim Paneli{% endblock %}
{% block page_title %}Yeni Fiş Ekle{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2>Fiş Bilgileri</h2>
    </div>
    <form method="post" action="{% url 'yonetim:fis_ekle' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label for="tutar">Tutar (TL)</label>
                <input type="number" id="tutar" name="tutar" step="0.01" min="0" required placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih" required>
            </div>
            <div class="form-group">
                <label for="kategori">Kategori</label>
                <input type="text" id="kategori" name="kategori" maxlength="100" required placeholder="Market, Yakıt, Ofis vb.">
            </div>
            <div class="form-group">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" placeholder="İsteğe bağlı açıklama"></textarea>
            </div>
            <div class="form-group">
                <label for="fis_gorseli">Fiş Görseli</label>
                <input type="file" id="fis_gorseli" name="fis_gorseli" accept="image/*">
            </div>
            <div class="form-group">
                <label for="butce">İlgili Bütçe (isteğe bağlı)</label>
                <select id="butce" name="butce">
                    <option value="">— Seçilmedi —</option>
                    {% for butce in butceler %}
                    <option value="{{ butce.id }}">#{{ butce.id }} — Güncel: {{ butce.guncel_butce }} TL</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Kaydet</button>
            <a href="{% url 'yonetim:fis_liste' %}" class="btn btn-secondary">İptal</a>
        </div>
    </form>
</div>
{% endblock %}
