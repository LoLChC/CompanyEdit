{% extends 'yonetim/base.html' %}

{% block title %}Yeni Haftalık Plan | Şirket Yönetim Paneli{% endblock %}
{% block page_title %}Yeni Haftalık Plan Ekle{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2>Plan Bilgileri</h2>
    </div>
    <form method="post" action="{% url 'yonetim:haftalik_plan_ekle' %}">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label for="baslik">Başlık</label>
                <input type="text" id="baslik" name="baslik" maxlength="200" required placeholder="Plan başlığı">
            </div>
            <div class="form-group">
                <label for="baslangic_tarihi">Başlangıç Tarihi</label>
                <input type="date" id="baslangic_tarihi" name="baslangic_tarihi" required>
            </div>
            <div class="form-group">
                <label for="bitis_tarihi">Bitiş Tarihi</label>
                <input type="date" id="bitis_tarihi" name="bitis_tarihi" required>
            </div>
            <div class="form-group">
                <label for="durum">Durum</label>
                <select id="durum" name="durum" required>
                    {% for value, label in durum_secenekleri %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="detay">Detay</label>
                <textarea id="detay" name="detay" placeholder="Plan detayları"></textarea>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Kaydet</button>
            <a href="{% url 'yonetim:haftalik_plan_liste' %}" class="btn btn-secondary">İptal</a>
        </div>
    </form>
</div>
{% endblock %}
